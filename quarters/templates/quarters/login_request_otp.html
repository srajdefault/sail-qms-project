{% extends "layout.html" %}

{% block title %}SAIL QMS - Login{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800/90 backdrop-blur-xl border border-slate-700/50 rounded-3xl p-8 shadow-2xl shadow-blue-950/50 space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-blue-600/30 border border-blue-400/30 flex items-center justify-center text-blue-400 text-2xl font-bold mx-auto">
                ⚡
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">SAIL QMS</h1>
            <p class="text-xs text-blue-300">Passwordless Quick Login</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div class="space-y-1.5">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400">Mobile Number / Email / Username</label>
                <input type="text" name="identifier" required placeholder="e.g. 9876543210 or EMP001" class="w-full bg-slate-900/80 border border-slate-700 text-slate-100 p-3.5 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm placeholder:text-slate-600">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/30 transition-all text-sm tracking-wide">
                Get Login OTP ➔
            </button>
        </form>
    </div>
</div>
{% endblock %}
