<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIL QMS - Verify OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800/90 backdrop-blur-xl border border-slate-700/50 rounded-3xl p-8 shadow-2xl shadow-blue-950/50 space-y-6">
        
        <div class="text-center space-y-2">
            <h2 class="text-xl font-bold text-white tracking-wide">Enter Security Code</h2>
            <p class="text-xs text-slate-400">OTP sent for user: <strong class="text-blue-400">{{ user.username }}</strong></p>
            <p class="text-[10px] text-amber-400 bg-amber-500/10 border border-amber-500/20 py-1 px-3 rounded-full inline-block">Check VS Code Terminal for OTP</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="p-3 bg-rose-500/10 border border-rose-500/20 text-rose-300 rounded-xl text-xs text-center">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <input type="text" name="otp" maxlength="6" required placeholder="6-Digit OTP" class="w-full bg-slate-900/80 border border-slate-700 text-slate-100 p-4 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-center font-mono text-xl tracking-[0.5em]">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-600/30 transition-all text-sm tracking-wide">
                Verify & Access Portal
            </button>
        </form>
    </div>
</body>
</html>
