{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SAIL QMS{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Global Layout Wrapper -->
    <div class="flex-grow flex flex-col justify-between">
        
        <!-- Page-Specific Main Content -->
        <main class="w-full">
            {% block content %}
            <!-- Child template content gets injected here -->
            {% endblock %}
        </main>

        <!-- Common Footer -->
        <footer class="py-4 text-center text-xs text-slate-500">
            &copy; SAIL Quarter Management System. All rights reserved.
        </footer>

    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
